# Database
spring.datasource.url=jdbc:postgresql://postgres:5432/tournament_manager
spring.datasource.username=postgres
spring.datasource.password=${POSTGRES_PASSWORD}

# Redis
spring.data.redis.host=redis
spring.data.redis.port=6379
spring.data.redis.password=${REDIS_PASSWORD}

# Kafka
spring.kafka.bootstrap-servers=kafka:29092

# OpenAI
openai.api.key=${OPENAI_API_KEY}

rate-limiting.trusted-proxies=172.16.0.0/12

# Logs structurés JSON pour production
logging.structured.format.console=logstash

# Point 33 : 100% de sampling (valeur par defaut, voir application.properties) devient
# couteux avec un vrai volume de trafic - stockage Jaeger, overhead reseau OTLP sur
# chaque requete. 10% reste largement suffisant pour detecter des tendances et des
# problemes de performance, sans payer le cout du tracing exhaustif.
management.tracing.sampling.probability=0.1
