spring.application.name=tournament-manager

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Liquibase
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# Profil actif
spring.profiles.active=local

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000
jwt.refresh-expiration=604800000

openai.api.key=${OPENAI_API_KEY:dummy-key-for-tests-never-used-for-real-calls}

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=tournament-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.tournament.tournament_manager.domain.event

# Dev
spring.devtools.restart.enabled=false
logging.level.org.springframework.security=DEBUG
logging.level.org.apache.kafka=WARN
logging.level.org.springframework.kafka=WARN

# Actuator / Prometheus
management.server.port=9001
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.prometheus.enabled=true
management.prometheus.metrics.export.enabled=true
management.endpoint.health.probes.enabled=true
management.endpoint.health.probes.add-additional-paths=true

# Resilience4j - Circuit Breaker OpenAI
resilience4j.circuitbreaker.instances.openai.sliding-window-size=10
resilience4j.circuitbreaker.instances.openai.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.openai.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.openai.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.openai.automatic-transition-from-open-to-half-open-enabled=true

# Rate limiting
rate-limiting.login.capacity=5
rate-limiting.player.capacity=10

# Rate limiting - trusted proxies (vide = ne jamais faire confiance à X-Forwarded-For)
rate-limiting.trusted-proxies=

# Virtual Threads (Java 21)
spring.threads.virtual.enabled=true

# OpenTelemetry / Tracing
management.tracing.sampling.probability=1.0
management.opentelemetry.tracing.export.otlp.endpoint=http://localhost:4318/v1/traces

# Purge des soft deletes
purge.retention-days=30

management.endpoint.health.show-details=when-authorized