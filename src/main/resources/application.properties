spring.application.name=tournament-manager

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true
# Point 33 : open-in-view desactive. Par defaut a "true" chez Spring Boot, ce qui
# permet aux relations lazy JPA d'etre chargees a n'importe quel moment jusqu'a la
# fin du rendu de la reponse HTTP - y compris depuis un mapper REST, en dehors de
# toute transaction explicite. Ca cache les vrais problemes de performance (le
# chargement lazy silencieux ressemble a du code normal, jusqu'a ce qu'il devienne
# un N+1) et garde la connexion DB ouverte plus longtemps que necessaire. Avec
# false, toute tentative de charger une relation lazy hors transaction leve une
# LazyInitializationException immediate et explicite au lieu d'un ralentissement
# silencieux en production.
spring.jpa.open-in-view=false

# Pool de connexions HikariCP - jamais dimensionne explicitement avant, les
# valeurs par defaut de Spring Boot (maximum-pool-size=10) etaient donc invisibles
# et non documentees. Valeurs de depart raisonnables pour ce projet ; a ajuster
# avec de vraies metriques de charge (Micrometer expose deja hikaricp.connections.*).
spring.datasource.hikari.pool-name=TournamentHikariPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Liquibase
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# Profil actif
# Point 2.4 de la revue : "spring.profiles.active=local" etait fige ici, donc cuit dans
# le jar. Ca fonctionnait parce que docker-compose l'ecrase par SPRING_PROFILES_ACTIVE,
# mais un jar lance "nu" (sans variable d'environnement) demarrait en config locale - avec
# logging.level.org.hibernate.orm.jdbc.bind=TRACE, soit tous les parametres SQL bindes
# ecrits en clair dans les logs, donnees personnelles comprises. Le profil est desormais
# fourni par l'environnement, jamais par le jar. Aucun profil par defaut n'est declare
# non plus : un jar lance sans profil n'a pas de spring.datasource.url et echoue au
# demarrage avec un message explicite, ce qui vaut mieux qu'un demarrage silencieux dans
# la mauvaise configuration.
#
# docker-compose : SPRING_PROFILES_ACTIVE=docker (deja present, voir docker-compose.yml)
# dev local      : ./mvnw spring-boot:run   (le profil "local" est cable dans le pom.xml,
#                  spring-boot-maven-plugin > configuration > profiles)
# jar autonome   : SPRING_PROFILES_ACTIVE=local java -jar target/*.jar
# tests          : voir src/test/resources/application.properties

# JWT
jwt.secret=${JWT_SECRET}
# Point 1.4 de la revue : l'access token durait 86400000 ms (24 h). Un JWT est stateless
# et non revocable - un token vole restait donc utilisable une journee entiere, ce qui
# annulait tout l'interet du mecanisme de refresh token pourtant deja en place (hash
# SHA-256, rotation, detection de reutilisation, session unique). 15 minutes : le refresh
# flow existe precisement pour absorber la difference cote client.
jwt.expiration=900000
jwt.refresh-expiration=604800000

# OpenAI
# Valeur par défaut non-vide : cette propriété n'était déclarée QUE dans
# application-docker.properties (où OPENAI_API_KEY est requis) — en dehors du profil
# docker (tests, CI), rien ne la définissait, donc OpenAiConfig.openAiClient (qui l'exige
# via @Value sans défaut) faisait échouer le chargement du contexte Spring entier. Le
# profil docker (voir application-docker.properties) écrase cette valeur par un vrai
# OPENAI_API_KEY en environnement réel ; ici, elle ne sert qu'à permettre au bean de se
# construire en test — aucun appel OpenAI réel n'est jamais fait avec cette valeur
# (le circuit breaker + les tests mockent GenerateCommentaryPort).
openai.api.key=${OPENAI_API_KEY:dummy-key-for-tests-never-used-for-real-calls}

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Kafka
# Point 2.4 de la revue : sept proprietes spring.kafka.producer.* / consumer.* ont ete
# retirees d'ici. KafkaConfig declare explicitement ProducerFactory et ConsumerFactory,
# ce qui fait reculer l'auto-configuration Spring Boot : ces proprietes n'avaient donc
# AUCUN effet, tout en dupliquant a l'identique ce qui est code en Java.
#
# Le piege n'etait pas theorique : auto-offset-reset=earliest figurait ici sans etre
# repris dans KafkaConfig, donc les consommateurs tournaient sur le defaut Kafka
# (latest) et un nouveau groupe sautait silencieusement tout l'historique du topic.
# Le reglage est desormais applique dans KafkaConfig.consumerFactory().
#
# bootstrap-servers reste ici : il varie par environnement et KafkaConfig le lit via
# @Value. Tout le reste se regle dans KafkaConfig.
spring.kafka.bootstrap-servers=localhost:9092

# Dev
spring.devtools.restart.enabled=false
logging.level.org.apache.kafka=WARN
logging.level.org.springframework.kafka=WARN
# Point 33 : "spring.jpa.show-sql=true" et "logging.level.org.springframework.security=DEBUG"
# vivaient auparavant ici, dans le fichier PARTAGE par tous les profils - donc actifs
# meme en profil "docker", pas seulement en dev local. Deplaces dans
# application-local.properties uniquement (voir ce fichier). show-sql=true est en
# plus un anti-pattern connu : il ecrit sur stdout directement, en contournant le
# framework de logging (donc impossible a filtrer/rediriger normalement) - remplace
# par logging.level.org.hibernate.SQL=DEBUG, la voie idiomatique Spring Boot.

# Actuator / Prometheus
# Actuator tourne sur un port séparé, non exposé par nginx ni publié sur l'hôte
# (voir docker-compose.yml : "expose: 9001" côté conteneur app uniquement).
# Seules les probes liveness/readiness restent accessibles sur le port principal
# (server.port), via /livez et /readyz, pour un éventuel orchestrateur.
management.server.port=9001
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.prometheus.enabled=true
management.prometheus.metrics.export.enabled=true
management.endpoint.health.probes.enabled=true
management.endpoint.health.probes.add-additional-paths=true

# ELO - point 35 : le facteur K était auparavant en dur (int K = 32) dans EloService,
# desormais configurable. Determine la vitesse a laquelle les classements bougent
# apres un match (K plus eleve = variations plus marquees).
elo.k-factor=32

# Resilience4j - Circuit Breaker OpenAI
resilience4j.circuitbreaker.instances.openai.sliding-window-size=10
resilience4j.circuitbreaker.instances.openai.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.openai.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.openai.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.openai.automatic-transition-from-open-to-half-open-enabled=true

# Rate limiting
rate-limiting.login.capacity=5
rate-limiting.player.capacity=10

# Rate limiting - trusted proxies (vide = ne jamais faire confiance à X-Forwarded-For)
rate-limiting.trusted-proxies=

# Virtual Threads (Java 21)
spring.threads.virtual.enabled=true

# OpenTelemetry / Tracing
# Point 33 : 100% de sampling reste raisonnable en local (voir le peu de trafic genere
# en dev, utile pour observer chaque requete pendant le developpement) - reduit en
# profil docker (voir application-docker.properties), plus proche d'un deploiement reel
# ou tracer 100% du trafic devient couteux (stockage Jaeger, overhead reseau OTLP).
management.tracing.sampling.probability=1.0
management.opentelemetry.tracing.export.otlp.endpoint=http://localhost:4318/v1/traces

# Purge des soft deletes
purge.retention-days=30

management.endpoint.health.show-details=when-authorized

# CORS - Point 33 : absent auparavant, ce qui bloquait silencieusement tout frontend
# navigateur hébergé sur une origine différente (aucun frontend de ce type n'existe
# encore dans ce projet, mais l'absence totale de configuration CORS aurait
# surpris n'importe qui essayant d'en brancher un). Liste vide par défaut = aucune
# origine autorisée (sûr par défaut) ; à surcharger par profil ou variable
# d'environnement selon les besoins réels (voir SecurityConfig.corsConfigurationSource).
app.cors.allowed-origins=

# Reconciliation des claims de round (point 2.2 de la revue, voir StaleRoundClaimScheduler).
# stale-after doit rester tres au-dessus de la duree d'une transaction d'avancement
# (quelques dizaines de ms) : trop court, le job libererait le claim d'une transaction encore
# en cours et autoriserait une creation concurrente du meme round.
round-claims.stale-after=PT10M
round-claims.reconciliation-interval=PT5M
