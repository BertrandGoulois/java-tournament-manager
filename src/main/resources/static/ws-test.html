<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Tournament Manager - WebSocket Test</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <style>
        body { font-family: monospace; padding: 2rem; background: #1e1e1e; color: #d4d4d4; }
        h1 { color: #569cd6; }
        button { padding: 0.5rem 1rem; margin-right: 0.5rem; cursor: pointer; border: none; border-radius: 4px; }
        #connectBtn { background: #4ec9b0; color: #1e1e1e; }
        #disconnectBtn { background: #f44747; color: white; }
        #status { margin: 1rem 0; font-weight: bold; }
        #status.connected { color: #4ec9b0; }
        #status.disconnected { color: #f44747; }
        #log { background: #252526; padding: 1rem; border-radius: 4px; min-height: 200px; margin-top: 1rem; }
        .event { border-left: 3px solid #569cd6; padding-left: 0.5rem; margin-bottom: 0.5rem; }
        .timestamp { color: #808080; font-size: 0.85rem; }
    </style>
</head>
<body>
<h1>🏆 Tournament Manager - WebSocket Live</h1>
<button id="connectBtn" onclick="connect()">Connecter</button>
<button id="disconnectBtn" onclick="disconnect()" disabled>Déconnecter</button>
<div id="status" class="disconnected">● Déconnecté</div>
<div id="log"></div>

<script>
    let stompClient = null;

    function connect() {
        const socket = new SockJS('/ws');
        stompClient = Stomp.over(socket);
        stompClient.debug = null;

        stompClient.connect({}, function () {
            document.getElementById('status').textContent = '● Connecté - en attente d\'événements...';
            document.getElementById('status').className = 'connected';
            document.getElementById('connectBtn').disabled = true;
            document.getElementById('disconnectBtn').disabled = false;

            stompClient.subscribe('/topic/matches', function (message) {
                const event = JSON.parse(message.body);
                const log = document.getElementById('log');
                const now = new Date().toLocaleTimeString();
                log.innerHTML = `<div class="event">
                        <div class="timestamp">${now}</div>
                        <div>🎯 Match terminé — ID: <strong>${event.matchId}</strong></div>
                    </div>` + log.innerHTML;
            });
        });
    }

    function disconnect() {
        if (stompClient) stompClient.disconnect();
        document.getElementById('status').textContent = '● Déconnecté';
        document.getElementById('status').className = 'disconnected';
        document.getElementById('connectBtn').disabled = false;
        document.getElementById('disconnectBtn').disabled = true;
    }
</script>
</body>
</html>
