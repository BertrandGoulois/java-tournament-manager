events {
    worker_connections 1024;
}

http {
    upstream app {
        server app:8080;
    }

    server {
        listen 80;

        # Point 35 de la revue : un seul header ajouté ici, pas quatre comme dans une
        # première tentative. Spring Security pose déjà par défaut X-Content-Type-Options,
        # X-Frame-Options et X-XSS-Protection (voir HeaderWriterFilter, actif sans
        # configuration explicite) - les dupliquer ici aurait produit des headers en
        # double, et pire, une VRAIE contradiction sur X-XSS-Protection (Spring Security
        # le met à "0" à raison - header obsolète, l'activer via "mode=block" peut même
        # introduire une faille sur les vieux navigateurs - alors qu'une première version
        # de ce fichier le forçait à "1; mode=block", en clair contradictoire avec
        # l'application elle-même). Seul Referrer-Policy manquait vraiment.
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        # CSP volontairement absente : ce nginx ne sert qu'un reverse proxy API JSON
        # (pas de HTML/JS applicatif servi ici, à l'exception de ws-test.html à des
        # fins de démo) - une CSP bien réglée sans rien casser demanderait de connaître
        # le vrai frontend qui consommera cette API, qui n'existe pas encore.

        location / {
            proxy_pass http://app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Point 35 : TLS absent auparavant. Bloc HTTPS prêt à l'emploi, désactivé par
    # défaut (nécessite un certificat qui n'existe pas encore dans le dépôt - jamais
    # commiter une clé privée, même auto-signée).
    #
    # Pour l'activer en LOCAL/DEV avec un certificat auto-signé (génère un avertissement
    # navigateur, normal et attendu - jamais valide pour un vrai déploiement public) :
    #
    #   mkdir -p docker/nginx/certs
    #   openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
    #     -keyout docker/nginx/certs/key.pem \
    #     -out docker/nginx/certs/cert.pem \
    #     -subj "/CN=localhost"
    #
    # Puis décommenter le bloc ci-dessous et ajouter le montage du volume
    # "./docker/nginx/certs:/etc/nginx/certs:ro" sur le service nginx dans
    # docker-compose.yml.
    #
    # En PRODUCTION : un certificat auto-signé n'est jamais acceptable (avertissement
    # navigateur systématique côté client) - utiliser Let's Encrypt/certbot (gratuit,
    # renouvellement automatique) pour un vrai nom de domaine, ou terminer le TLS en
    # amont (load balancer cloud / reverse proxy dédié) plutôt que dans ce conteneur.
    #
    # HSTS (Strict-Transport-Security) volontairement posé ici, au niveau du TLS, et
    # non délégué à Spring Security : Spring Security ne l'active que s'il détecte une
    # requête réellement sécurisée, ce qui nécessite de configurer explicitement la
    # confiance envers X-Forwarded-Proto derrière ce reverse proxy - plus fiable de le
    # garder au point exact où le TLS est effectivement terminé.
    #
    # server {
    #     listen 443 ssl;
    #     ssl_certificate     /etc/nginx/certs/cert.pem;
    #     ssl_certificate_key /etc/nginx/certs/key.pem;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #
    #     add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    #     add_header Referrer-Policy strict-origin-when-cross-origin always;
    #
    #     location / {
    #         proxy_pass http://app;
    #         proxy_set_header Host $host;
    #         proxy_set_header X-Real-IP $remote_addr;
    #         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #         proxy_set_header X-Forwarded-Proto $scheme;
    #     }
    # }
}
