name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Annule toute exécution en cours sur la même branche quand un nouveau push arrive -
# évite deux jobs "build" concurrents qui pousseraient chacun un badge vers gh-pages
# en même temps (risque de conflit, point 28/30 de la revue).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Point 30 : "aucun scan de sécurité" était le manque le plus criant, pour un projet
  # qui a laissé passer un secret JWT plus tôt dans son histoire (commits f791295 et
  # 1d2569d). Job rapide, indépendant, ne bloque pas le reste si Gitleaks est lent.
  #
  # Rappel : Gitleaks n'aurait PAS attrapé ce secret-là. C'était une chaîne hexadécimale,
  # qui ne correspond à aucune signature de secret connue - contrairement à un "sk-proj-…".
  # Un scanner de secrets réduit la surface, il ne la ferme pas.
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # gitleaks scanne l'historique complet, pas juste le dernier commit

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # §6 de la revue : ce job avait "contents: write" pour publier le badge de couverture,
    # ce qui donnait un droit d'écriture sur le dépôt au job qui exécute aussi tout le code
    # de test et toutes les dépendances tierces. La publication du badge est déplacée dans
    # le job "publish-badges" ci-dessous ; celui-ci redescend en lecture seule.
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Grant execute permission for mvnw
        run: chmod +x mvnw

      # Plus de "env: JWT_SECRET" ici : le vrai secret de signature de l'application n'a
      # aucune raison d'entrer dans un runner CI (point 1.1). Les tests prennent désormais
      # leur clé dans src/test/resources/application.properties, valeur de test dédiée.
      - name: Build and test
        run: ./mvnw verify

      - name: Generate JaCoCo Badge
        uses: cicirello/jacoco-badge-generator@v2
        with:
          generate-branches-badge: true
          jacoco-csv-file: target/site/jacoco/jacoco.csv
          badges-directory: badges-output

      - name: Upload coverage badges
        uses: actions/upload-artifact@v4
        with:
          name: coverage-badges
          path: badges-output
          retention-days: 1

  integration-tests:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Grant execute permission for mvnw
        run: chmod +x mvnw

      # Point 29/30 : mvn verify (pas test -Pintegration-tests, le profil n'existe
      # plus - voir pom.xml) déclenche maven-failsafe-plugin, qui exécute nativement
      # tout ce qui suit la convention *IT. -Dsurefire.skip=true évite de rejouer les
      # tests rapides déjà passés dans le job "build" ci-dessus.
      #
      # §6 de la revue : "continue-on-error: true" a été RETIRÉ. Les 9 tests d'intégration
      # (sécurité JSON-RPC, rate limiting, parcours de tournoi complets) ne bloquaient rien
      # et une régression sur JsonRpcSecurityIT serait passée au vert. La "phase
      # d'observation" invoquée n'avait pas de date de fin ; elle s'arrête ici.
      #
      # La flakiness reste traitée, mais nommément : rerunFailingTestsCount=2 absorbe
      # l'aléa ponctuel, et un test réellement instable se voit poser @Tag("flaky") plus
      # -Dfailsafe.excludedGroups=flaky, ce qui met UN test en quarantaine visible au lieu
      # de désarmer le job entier.
      - name: Run integration tests
        run: ./mvnw verify -Dsurefire.skip=true

      - name: Upload failsafe reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failsafe-reports
          path: target/failsafe-reports
          retention-days: 7

  # Point 28 : le badge était auparavant commité directement sur main à chaque push
  # (46 des 176 commits du dépôt), polluant git log/git bisect et créant un risque de
  # conflit sur deux pushs rapprochés. Publié sur gh-pages, comme la Javadoc (voir
  # javadoc.yml) - aucun commit sur main.
  #
  # §6 : job dédié, seul à porter "contents: write", et qui n'exécute aucun code du
  # projet - il ne fait que republier un artefact déjà produit. Une dépendance compromise
  # dans l'arbre Maven ne dispose donc plus d'un jeton en écriture.
  publish-badges:
    needs: [ build, integration-tests ]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download coverage badges
        uses: actions/download-artifact@v4
        with:
          name: coverage-badges
          path: badges-output

      # keep_files: true est essentiel ici : sans lui, cette publication effacerait le
      # contenu déjà présent sur gh-pages (la Javadoc), et réciproquement.
      - name: Publish coverage badges to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: badges-output
          destination_dir: badges
          keep_files: true
