name: Javadoc

on:
  push:
    branches: [ main ]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Generate Javadoc
        run: |
          chmod +x mvnw
          ./mvnw javadoc:javadoc -q

      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: target/site/apidocs
          # Essentiel depuis que ci.yml publie aussi sur gh-pages (badges/, voir point
          # 28 de la revue) : sans keep_files, cette publication effacerait le
          # contenu déjà présent sur gh-pages, et réciproquement.
          keep_files: true
