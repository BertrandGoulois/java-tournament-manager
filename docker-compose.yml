services:
  postgres:
    image: postgres:16
    container_name: tournament-postgres
    environment:
      POSTGRES_DB: tournament_manager
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      # Exposition dev uniquement (accès DBeaver/psql direct depuis l'hôte).
      # Protégé par mot de passe (POSTGRES_PASSWORD) ; à retirer si le poste
      # n'est pas de confiance ou en déploiement réellement partagé.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: tournament-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    # Pas de "ports:" : Redis ne doit être joignable que depuis le réseau
    # interne docker-compose, pas depuis l'hôte.
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "$${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Kafka en mode KRaft (broker + controller combinés, un seul nœud) : plus de
  # Zookeeper, retiré du fichier - architecture recommandée par Confluent/Apache
  # Kafka depuis la 3.x, Zookeeper est en fin de vie côté Kafka lui-même. Un seul
  # service en moins à démarrer, healthchecker et maintenir.
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: tournament-kafka
    ports:
      # Exposition dev uniquement. Écoute en PLAINTEXT, sans authentification -
      # acceptable pour du développement local, à ne jamais reproduire tel quel
      # en production (SASL/SSL requis, hors périmètre de ce projet de démo).
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT_INTERNAL://0.0.0.0:29092,PLAINTEXT_EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_INTERNAL://kafka:29092,PLAINTEXT_EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT_INTERNAL:PLAINTEXT,PLAINTEXT_EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Un seul nœud jouant à la fois broker et controller : il vote pour lui-même.
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      # Identifiant de cluster KRaft (obligatoire, généré une fois pour toutes -
      # exemple standard tiré de la documentation Confluent, suffisant pour du
      # développement local à nœud unique).
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: tournament-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  app:
    build: .
    container_name: tournament-app
    expose:
      - "8080"
      - "9001"
    # Point 1.6 de la revue : "ports: 9001:9001" a été retiré. ManagementSecurityConfig
    # fait permitAll() sur tout l'actuator en justifiant que « seul le réseau interne peut
    # l'atteindre » — ce qui était faux tant que le port était publié sur l'hôte :
    # /actuator/metrics et /actuator/prometheus (noms d'endpoints, latences, compteurs
    # métier, versions de dépendances) étaient lisibles par quiconque atteignait la machine.
    # Le commentaire et le compose se contredisaient ; c'est le compose qui avait tort.
    #
    # Prometheus scrape app:9001 par le réseau interne docker-compose (voir prometheus.yml),
    # il n'a jamais eu besoin de cette publication. Pour un accès depuis l'hôte en dev :
    #     docker compose exec app wget -qO- http://localhost:9001/actuator/health
    # ou, ponctuellement : docker compose run --rm --publish 9001:9001 app
    environment:
      SPRING_PROFILES_ACTIVE: docker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
      JWT_SECRET: ${JWT_SECRET}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # Point 1.5 : mot de passe initial du compte admin. Absent = démarrage en échec.
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9001/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    container_name: tournament-jaeger
    ports:
      - "16686:16686"   # UI Jaeger
      - "4318:4318"     # OTLP HTTP
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

  prometheus:
    image: prom/prometheus:v3.0.1
    container_name: tournament-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      # §8 : regles d'alerte, montees separement pour rester lisibles et versionnables
      # independamment de la configuration de scrape.
      - ./docker/prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml
    depends_on:
      app:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.4.0
    container_name: tournament-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    depends_on:
      - prometheus

  nginx:
    image: nginx:1.27-alpine
    container_name: tournament-nginx
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      app:
        condition: service_healthy

volumes:
  postgres_data:
  grafana_data:
